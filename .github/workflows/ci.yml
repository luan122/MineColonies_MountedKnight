name: CI Build Check

on:
  pull_request:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Java version from gradle.properties
        id: props
        run: |
          java_ver=$(grep '^java_version=' gradle.properties | cut -d'=' -f2)
          mc_ver=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          mod_ver=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "java_version=${java_ver}" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=${mc_ver}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${mod_ver}" >> "$GITHUB_OUTPUT"

      - name: Setup Java ${{ steps.props.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecolonies_mounted_knight-${{ steps.props.outputs.minecraft_version }}-${{ steps.props.outputs.mod_version }}-PR${{ github.event.pull_request.number }}
          path: build/libs/minecolonies_mounted_knight-*.jar
          retention-days: 7
